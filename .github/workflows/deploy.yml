name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build

      # Копируем cms-data.json в dist (Vite уже копирует public/, но на всякий случай)
      - name: Copy CMS data
        run: |
          if [ -f public/cms-data.json ]; then
            cp public/cms-data.json dist/cms-data.json
            echo "✅ cms-data.json скопирован в dist"
          else
            echo "⚠️ cms-data.json не найден, пропускаем"
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages