    <!-- GitHub Pages SPA redirect: восстанавливаем реальный URL ДО загрузки React -->
    <script>
      (function() {
        var loc = window.location;
        if (loc.search && loc.search.startsWith('?/')) {
          var path = loc.search.substring(1);
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, '/polcol' + path);

      })();

    <!-- Mobile: force all elements visible before React loads to prevent flickering -->
    <script>
      (function() {
        if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
          var style = document.createElement('style');
          style.textContent = [
            'body { overflow-x: clip !important; scroll-behavior: auto !important; }',
            '[style*="opacity:0"] { opacity: 1 !important; }',
            '[style*="opacity: 0"] { opacity: 1 !important; }',
            '[style*="transform: translateX"] { transform: none !important; }',
            '[style*="transform: translateY"] { transform: none !important; }',
            '.backdrop-blur, .backdrop-blur-md, .backdrop-blur-lg { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }',
            '*, *::before, *::after { will-change: auto !important; animation-duration: 0ms !important; }',
          ].join('\n');
          document.head.appendChild(style);

          // MutationObserver: force opacity:1 on any element framer-motion sets to 0
          var observer = new MutationObserver(function(mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var el = mutations[i].target;
              if (el.style && el.style.opacity === '0') {
                el.style.opacity = '1';
              }
              if (el.style && el.style.transform && el.style.transform !== 'none') {
                el.style.transform = 'none';
              }
            }
          });
          observer.observe(document.documentElement, { 
            attributes: true, 
            subtree: true, 
            attributeFilter: ['style'] 
          });
        }
      })();
    </script>
